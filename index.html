<style>
:root{--fond:#05080C;--panneau:#0A1118;--panneau2:#111C28;--bord:#1B2B3B;--texte:#E4F0FF;--doux:#7B91A8;
--accent:#FF8A1F;--retard:#FF4D6D;--jaune:#FFD23F;--ok:#5BE38F}
*{box-sizing:border-box}
html{background:var(--fond)}
html,body{margin:0;color:var(--texte);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{background:var(--fond);min-height:100vh;
padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;letter-spacing:.12em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.maj{font-size:12px;color:var(--doux);text-align:right}
.maj.vieux{color:var(--jaune)}
button{background:var(--panneau2);color:var(--texte);border:1px solid var(--accent);border-radius:8px;font:inherit;font-size:14px;padding:9px 16px}
button:disabled{opacity:.7}
h2{font-size:11px;letter-spacing:.18em;color:var(--doux);text-transform:uppercase;margin:22px 0 8px}
.alerte{background:#2a2108;border:1px solid var(--jaune);color:var(--jaune);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.erreur{background:#2a0d14;border-color:var(--retard);color:#ffb3c0}
.resume{display:flex;flex-wrap:wrap;gap:6px}
.puce{border:1px solid var(--accent);border-radius:999px;padding:5px 11px;font-size:13px}
.machines{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{background:var(--panneau);border:1px solid var(--bord);border-radius:12px;padding:12px;min-height:92px}
.m.actif{border-color:var(--c)}
.m .nom{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
.pt{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.m .etat{font-size:13px;color:var(--doux);margin-top:6px}
.m .client{font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre{height:6px;background:var(--panneau2);border-radius:3px;margin-top:8px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--c);border-radius:3px}
.pct{font-size:22px;font-weight:700;margin-top:4px}
.recup{color:var(--jaune);font-weight:600}
.m button{width:100%;margin-top:10px;border-color:var(--ok);font-size:14px;padding:9px 6px}
.m button.fort{background:var(--ok);color:#04130A;font-weight:700}
.m .attente{font-size:12px;color:var(--ok);margin-top:10px}
.m button.cam{border-color:var(--c);margin-top:8px}
#camera{position:fixed;inset:0;background:rgba(5,8,12,.97);z-index:10;display:none;flex-direction:column;
padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#camera.ouvert{display:flex}
#camera .tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#camera .tete b{font-size:17px;letter-spacing:.06em}
#camera .cadre{flex:1;display:flex;align-items:center;justify-content:center;background:var(--panneau);border:1px solid var(--bord);border-radius:12px;overflow:hidden}
#camera img{max-width:100%;max-height:100%;display:block}
#camera .info{font-size:13px;color:var(--doux);margin-top:10px;text-align:center;line-height:1.4}
.prochaine{font-size:12px;color:var(--doux);margin-top:6px}
.t{display:flex;gap:10px;align-items:flex-start;background:var(--panneau);border:1px solid var(--bord);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.t .h{font-weight:700;min-width:48px;font-variant-numeric:tabular-nums}
.t .quoi{font-size:11px;color:var(--doux);margin-top:2px}
.t.retard{border-color:var(--retard);border-left-color:var(--retard)}
.t.retard .h{color:var(--retard)}
.vide{color:var(--doux);font-size:14px;padding:4px 0}
.jour{font-weight:600;margin:12px 0 6px}
.bas{text-align:center;margin-top:24px}
.aide{color:var(--doux);font-size:14px;line-height:1.5}
.repos{background:#141024;border:1px solid #8B7CF6;border-left:4px solid #8B7CF6;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.repos b{color:#B9AEFF}
.repos .quoi{font-size:12px;color:var(--doux);margin-top:2px}
.lr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lr button{padding:6px 12px;font-size:13px;border-color:var(--retard);flex:none}
.attente2{font-size:12px;color:var(--ok)}
.bas button{margin:4px}
#bRepos{border-color:#8B7CF6}
#fRepos{position:fixed;inset:0;background:var(--fond);z-index:11;display:none;overflow:auto;
padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
#fRepos.ouvert{display:block}
#fRepos .tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#fRepos .tete b{font-size:17px;letter-spacing:.06em}
#fRepos label{display:block;font-size:13px;color:var(--doux);margin:14px 0 6px}
#fRepos input[type=date],#fRepos input[type=time],#fRepos input[type=text]{width:100%;background:var(--panneau2);color:var(--texte);
border:1px solid var(--bord);border-radius:8px;padding:10px;font:inherit;font-size:16px;-webkit-appearance:none;min-height:44px}
#fRepos .deux{display:flex;gap:10px;align-items:center}
#fRepos .deux input{flex:1}
#fRepos .coche{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px;color:var(--texte)}
#fRepos .coche input{width:22px;height:22px}
#fRepos .ok{width:100%;margin-top:20px;background:#8B7CF6;border-color:#8B7CF6;color:#0B0718;font-weight:700;padding:12px}
#rErreur{color:#ffb3c0;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<header><h1>MKLM<span>3D</span></h1><div><div class="maj" id="maj"></div><div class="maj" id="lu"></div></div></header>
<div id="alerte"></div>
<div id="contenu"></div>
<p class="bas"><button id="bRepos" onclick="ouvrirRepos()">☾ Repos</button><button id="bouton" onclick="actualiser()">Actualiser</button></p>
<div id="fRepos"><div class="tete"><b>☾ Jour de repos</b><button onclick="fermerRepos()">Fermer</button></div>
<div class="aide">Comme sur le PC : aucun devis ni aucune tâche n'est planifié ces jours-là.</div>
<label for="rDu">Du</label><input type="date" id="rDu">
<label for="rAu">Au (facultatif, pour plusieurs jours)</label><input type="date" id="rAu">
<div class="coche"><input type="checkbox" id="rJournee" checked onchange="cocheJournee()"><span>Toute la journée</span></div>
<div id="rHeures" style="display:none"><label>De quelle heure à quelle heure ?</label>
<div class="deux"><input type="time" id="rH1" value="08:00"><span>à</span><input type="time" id="rH2" value="12:00"></div></div>
<label for="rNote">Description (facultatif)</label><input type="text" id="rNote" maxlength="80" placeholder="ex. entretien des machines, rendez-vous…">
<div id="rErreur"></div>
<button class="ok" id="rOk" onclick="envoyerRepos()">Enregistrer le repos</button>
<h2>Repos prévus</h2><div id="rListe"></div></div>
<div id="camera"><div class="tete"><b id="camTitre">Caméra</b><button onclick="fermerCamera()">Fermer</button></div>
<div class="cadre"><img id="camImg" alt=""><span id="camAttente" class="aide">Connexion à la caméra…</span></div>
<div class="info" id="camInfo"></div></div>
<script>
// La page ne contient aucune donnée : elle va les chercher chez Google (ton script), avec la clé secrète
// qui est dans le lien de l'icône (après le #, cette partie n'est jamais envoyée à GitHub).
var CONFIG = lireConfig();
var ETAT = null, LU = null;

function lireConfig() {
  var c = {};
  (location.hash || "").replace(/^#/, "").split("&").forEach(function (p) {
    var i = p.indexOf("=");
    if (i > 0) c[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1));
  });
  try {
    if (c.u && c.k) localStorage.setItem("mklm3d", JSON.stringify({u: c.u, k: c.k}));
    else { var s = JSON.parse(localStorage.getItem("mklm3d") || "null"); if (s) { c.u = s.u; c.k = s.k; } }
  } catch (e) {}
  return (c.u && c.k) ? {u: c.u, k: c.k} : null;
}

function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
function hm(ms) { var d = new Date(ms); return d.getHours() + "h" + ("0" + d.getMinutes()).slice(-2); }
function duree(min) { min = Math.max(0, Math.round(min)); if (min < 60) return min + " min"; var h = Math.floor(min / 60), m = min % 60; return h + " h" + (m ? " " + ("0" + m).slice(-2) : ""); }

function tache(t) {
  var sous = [t.machine ? esc(t.machine) : "", t.retard ? "en retard" : ""].filter(Boolean).join(" · ");
  return '<div class="t' + (t.retard ? " retard" : "") + '" style="--c:' + esc(t.couleur) + '"><div class="h">' + esc(t.heure) +
    '</div><div><div>' + (t.quoi ? esc(t.quoi) + " : " : "") + esc(t.client) + '</div>' + (sous ? '<div class="quoi">' + sous + '</div>' : "") + '</div></div>';
}

function dessiner() {
  var alerte = document.getElementById("alerte");
  if (!CONFIG) {
    document.getElementById("contenu").innerHTML = '<p class="aide">Cette page a besoin de ton lien personnel.<br>' +
      'Sur le PC : Carnet → Réglages → Carnet mobile (iPhone)… puis scanne le QR code avec l\'iPhone.</p>';
    document.getElementById("bouton").style.display = "none";
    document.getElementById("bRepos").style.display = "none";
    return;
  }
  if (!ETAT) { document.getElementById("contenu").innerHTML = '<p class="aide">Chargement…</p>'; return; }
  var now = Date.now(), e = ETAT, age = (now - e.maj) / 60000;
  var maj = document.getElementById("maj");
  maj.textContent = "mis à jour " + (age < 1 ? "à l'instant" : "il y a " + duree(age));
  maj.className = "maj" + (age > 10 ? " vieux" : "");
  document.getElementById("lu").textContent = LU ? "actualisée à " + hm(LU) : "";
  if (age > 10 && !alerte.dataset.erreur) {
    alerte.innerHTML = '<div class="alerte">Le Carnet n\'a rien envoyé depuis ' + duree(age) + ' (dernier envoi : ' + esc(e.maj_texte) + '). Le PC est peut-être éteint ou le Carnet fermé.</div>';
  } else if (!alerte.dataset.erreur) { alerte.innerHTML = ""; }
  var h = '<div class="resume">' + (e.resume || []).map(function (r) { return '<span class="puce">' + esc(r) + '</span>'; }).join("") + '</div>';
  h += '<h2>Machines</h2><div class="machines">' + (e.machines || []).map(function (m) {
    var s = '<div class="m' + (m.etat != "libre" ? " actif" : "") + '" style="--c:' + esc(m.couleur) + '"><div class="nom"><span class="pt"></span>' + esc(m.court) + '</div>';
    if (m.etat == "libre") { s += '<div class="etat">libre</div>'; }
    else {
      var f = (m.lance && m.fin && m.fin > m.lance) ? Math.min(1, Math.max(0, (now - m.lance) / (m.fin - m.lance))) : 1;
      if (f < 1) s += '<div class="pct">' + Math.round(f * 100) + ' %</div><div class="barre"><i style="width:' + (f * 100) + '%"></i></div>' +
        '<div class="etat">fin vers ' + hm(m.fin) + ' · reste ' + duree((m.fin - now) / 60000) + '</div>';
      else s += '<div class="pct recup">à récupérer</div><div class="barre"><i style="width:100%"></i></div>' + (m.fin ? '<div class="etat">fini à ' + hm(m.fin) + '</div>' : "");
      s += '<div class="client">' + esc(m.client) + '</div>';
      if (m.id) {
        if (ENVOYES[m.id]) s += '<div class="attente">✓ Récupération signalée. Le PC la prend en compte dans la minute.</div>';
        else s += '<button class="' + (f < 1 ? "" : "fort") + '" onclick="recuperee(' + Number(m.id) + ')">Récupérée ✓</button>';
      }
    }
    if (m.prochaine) s += '<div class="prochaine">Ensuite : ' + esc(m.prochaine) + '</div>';
    if (m.camera || m.nom === "Snapmaker U1") s += '<button class="cam" onclick="ouvrirCamera(\'' + esc(m.court) + '\')">Voir la caméra</button>';
    return s + "</div>";
  }).join("") + '</div>';
  var rAuj = reposDu(e.aujourdhui);
  h += "<h2>Aujourd'hui</h2>" + (rAuj ? blocRepos(rAuj) : "") +
    ((e.jour && e.jour.length) ? e.jour.map(tache).join("") : (rAuj ? "" : '<div class="vide">Rien de prévu, tout est à jour.</div>'));
  if ((e.a_venir || []).length) {
    h += "<h2>Les jours suivants</h2>" + e.a_venir.map(function (j) {
      var r = reposDu(j.iso);
      return '<div class="jour">' + esc(j.jour) + '</div>' + (r ? blocRepos(r) : "") +
        (j.taches.length ? j.taches.map(tache).join("") : (r ? "" : '<div class="vide">rien de prévu</div>'));
    }).join("");
  }
  document.getElementById("contenu").innerHTML = h;
  listeRepos();
}

// ---------- Jours de repos
function reposDu(iso) { return iso ? ((ETAT && ETAT.repos) || []).filter(function (r) { return r.iso === iso; })[0] : null; }
function blocRepos(r) {
  return '<div class="repos">☾ <b>Repos</b>' + (r.heures ? " · " + esc(r.heures) : " · toute la journée") +
    (r.note ? '<div class="quoi">' + esc(r.note) + '</div>' : "") + '</div>';
}
var REPOS_ENVOYES = [];      // demandes parties vers le PC, pas encore prises en compte
function listeRepos() {
  var z = document.getElementById("rListe");
  if (!z) return;
  var liste = (ETAT && ETAT.repos) || [];
  REPOS_ENVOYES = REPOS_ENVOYES.filter(function (a) { return Date.now() - a.ms < 300000; });
  var h = REPOS_ENVOYES.map(function (a) { return '<div class="attente2">✓ ' + esc(a.texte) + ' — envoyé, le PC le prend en compte dans la minute.</div>'; }).join("");
  h += liste.length ? liste.map(function (r) {
    var retire = REPOS_ENVOYES.some(function (a) { return a.retire === r.iso; });
    return '<div class="repos lr"><div><b>' + esc(r.jour) + '</b>' + (r.heures ? " · " + esc(r.heures) : "") +
      (r.note ? '<div class="quoi">' + esc(r.note) + '</div>' : "") + '</div>' +
      (retire ? '<span class="attente2">retrait envoyé</span>' : '<button onclick="retirerRepos(\'' + esc(r.iso) + '\')">Retirer</button>') + '</div>';
  }).join("") : '<div class="vide">Aucun jour de repos prévu.</div>';
  z.innerHTML = h;
}
function aujourdhuiIso() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function ouvrirRepos() {
  if (!CONFIG) return;
  var du = document.getElementById("rDu");
  if (!du.value) du.value = aujourdhuiIso();
  du.min = aujourdhuiIso(); document.getElementById("rAu").min = aujourdhuiIso();
  document.getElementById("rErreur").textContent = "";
  document.getElementById("fRepos").className = "ouvert";
  listeRepos();
}
function fermerRepos() { document.getElementById("fRepos").className = ""; }
function cocheJournee() { document.getElementById("rHeures").style.display = document.getElementById("rJournee").checked ? "none" : ""; }
function dateFr(iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; }
function envoyerRepos() {
  var du = document.getElementById("rDu").value, au = document.getElementById("rAu").value || du;
  var journee = document.getElementById("rJournee").checked;
  var h1 = journee ? "" : document.getElementById("rH1").value, h2 = journee ? "" : document.getElementById("rH2").value;
  var note = document.getElementById("rNote").value.trim(), err = document.getElementById("rErreur");
  if (!du) { err.textContent = "Choisis la date."; return; }
  if (du < aujourdhuiIso()) { err.textContent = "Cette date est déjà passée."; return; }
  if (au < du) { err.textContent = "La 2e date doit être après la 1re."; return; }
  if (!journee && (!h1 || !h2 || h2 <= h1)) { err.textContent = "Choisis les heures (la 2e après la 1re), ou coche « Toute la journée »."; return; }
  err.textContent = "";
  var b = document.getElementById("rOk"); b.disabled = true; b.textContent = "Envoi…";
  var texte = "Repos " + (au !== du ? "du " + dateFr(du) + " au " + dateFr(au) : "le " + dateFr(du)) + (h1 ? " de " + h1 + " à " + h2 : "");
  envoyerAction("&action=repos&debut=" + du + "&fin=" + au + "&h1=" + encodeURIComponent(h1) + "&h2=" + encodeURIComponent(h2) +
                "&note=" + encodeURIComponent(note),
    function () {
      b.disabled = false; b.textContent = "Enregistrer le repos";
      REPOS_ENVOYES.push({texte: texte, ms: Date.now()});
      document.getElementById("rNote").value = ""; document.getElementById("rAu").value = "";
      listeRepos();
      setTimeout(function () { charger(); }, 20000); setTimeout(function () { charger(); }, 70000);
    },
    function () { b.disabled = false; b.textContent = "Enregistrer le repos"; });
}
function retirerRepos(iso) {
  var r = reposDu(iso);
  if (!r || !confirm("Retirer le repos du " + r.jour + " ?")) return;
  envoyerAction("&action=repos_retirer&jour=" + iso, function () {
    REPOS_ENVOYES.push({texte: "Retrait du repos du " + r.jour, retire: iso, ms: Date.now()});
    listeRepos();
    setTimeout(function () { charger(); }, 20000); setTimeout(function () { charger(); }, 70000);
  });
}

// Envoie une action au script Google (le Carnet du PC la prend dans la minute).
function envoyerAction(extra, ok, ko) {
  var fini = false;
  function reussi(d) {
    if (fini) return; fini = true;
    if (d && d.ok === false) { alert("Le script Google a refusé : " + (d.erreur || "erreur") + "\nVérifie qu'il est bien à jour (nouvelle version déployée)."); if (ko) ko(); return; }
    ok(d);
  }
  function rate() { if (fini) return; fini = true; alert("Impossible de joindre Google (pas de réseau ?). Réessaie."); if (ko) ko(); }
  function jsonp() {
    var nom = "mkr" + Date.now(), s = document.createElement("script");
    window[nom] = function (d) { delete window[nom]; s.remove(); reussi(d); };
    s.onerror = function () { s.remove(); rate(); };
    s.src = adresse(extra + "&callback=" + nom);
    document.head.appendChild(s);
    setTimeout(rate, 15000);
  }
  try {
    fetch(adresse(extra), {credentials: "omit", cache: "no-store", redirect: "follow"})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(reussi).catch(jsonp);
  } catch (e) { jsonp(); }
}

function adresse(extra) { return CONFIG.u + (CONFIG.u.indexOf("?") < 0 ? "?" : "&") + "cle=" + encodeURIComponent(CONFIG.k) + extra + "&t=" + Date.now(); }

// 1er essai : lecture directe (sans les comptes Google du téléphone). 2e essai : JSONP.
function charger(ok, ko) {
  if (!CONFIG) { if (ko) ko(); return; }
  var fini = false;
  function reussi(d) {
    if (fini) return; fini = true;
    var alerte = document.getElementById("alerte");
    if (d && d.ok === false) { alerte.dataset.erreur = "1"; alerte.innerHTML = '<div class="alerte erreur">Lien refusé par le script Google : rescanne le QR code depuis le Carnet.</div>'; if (ko) ko(); return; }
    delete alerte.dataset.erreur;
    if (d && d.etat) {
      ETAT = d.etat; LU = Date.now();
      var encore = {};
      (ETAT.machines || []).forEach(function (x) { if (x.id && ENVOYES[x.id] && Date.now() - ENVOYES[x.id] < 300000) encore[x.id] = ENVOYES[x.id]; });
      ENVOYES = encore;
    }
    dessiner(); if (ok) ok();
  }
  function echec() {
    if (fini) return; fini = true;
    var alerte = document.getElementById("alerte");
    alerte.dataset.erreur = "1";
    alerte.innerHTML = '<div class="alerte erreur">Impossible de joindre Google pour le moment (pas de réseau ?). Réessaie avec « Actualiser ».</div>';
    if (ko) ko();
  }
  function jsonp() {
    var nom = "mk" + Date.now(), s = document.createElement("script");
    window[nom] = function (d) { delete window[nom]; s.remove(); reussi(d); };
    s.onerror = function () { s.remove(); echec(); };
    s.src = adresse("&callback=" + nom);
    document.head.appendChild(s);
    setTimeout(echec, 15000);
  }
  try {
    fetch(adresse("&format=json"), {credentials: "omit", cache: "no-store", redirect: "follow"})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(reussi)
      .catch(jsonp);
  } catch (e) { jsonp(); }
}

// Bouton « Récupérée » : on prévient le script Google, le Carnet (PC) fait le reste dans la minute.
var ENVOYES = {};
function recuperee(id) {
  var m = (ETAT.machines || []).filter(function (x) { return x.id === id; })[0];
  if (!m) return;
  var encore = (m.fin && Date.now() < m.fin) ? "\n\nAttention : d'après le Carnet, l'impression n'est pas encore finie." : "";
  if (!confirm("Tu as bien récupéré « " + m.client + " » sur la " + m.court + " ?" + encore)) return;
  var fini = false;
  function ok(d) {
    if (fini) return; fini = true;
    if (d && d.ok === false) { alert("Le script Google a refusé : " + (d.erreur || "erreur") + "\nVérifie qu'il est bien à jour (nouvelle version déployée)."); return; }
    ENVOYES[id] = Date.now(); dessiner();
    setTimeout(function () { charger(); }, 20000); setTimeout(function () { charger(); }, 70000);
  }
  function ko() { if (fini) return; fini = true; alert("Impossible de joindre Google (pas de réseau ?). Réessaie."); }
  function jsonp() {
    var nom = "mka" + Date.now(), s = document.createElement("script");
    window[nom] = function (d) { delete window[nom]; s.remove(); ok(d); };
    s.onerror = function () { s.remove(); ko(); };
    s.src = adresse("&action=recuperee&id=" + id + "&callback=" + nom);
    document.head.appendChild(s);
    setTimeout(ko, 15000);
  }
  try {
    fetch(adresse("&action=recuperee&id=" + id), {credentials: "omit", cache: "no-store", redirect: "follow"})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(ok).catch(jsonp);
  } catch (e) { jsonp(); }
}

// Caméra de la U1 : l'image passe par le Carnet (PC allumé à la maison) puis par ton script Google.
var CAM = {ouvert: false, minuterie: null, debut: 0};
function ouvrirCamera(nom) {
  CAM.ouvert = true; CAM.debut = Date.now();
  document.getElementById("camTitre").textContent = "Caméra " + nom;
  document.getElementById("camImg").style.display = "none";
  document.getElementById("camAttente").style.display = "";
  document.getElementById("camAttente").textContent = "Connexion à la caméra…";
  document.getElementById("camInfo").textContent = "La première image arrive en 5 secondes environ.";
  document.getElementById("camera").className = "ouvert";
  imageCamera();
}
function fermerCamera() {
  CAM.ouvert = false; clearTimeout(CAM.minuterie);
  document.getElementById("camera").className = "";
}
function imageCamera() {
  if (!CAM.ouvert || !CONFIG) return;
  var fini = false, depart = Date.now();
  // une demande par seconde (si Google met plus d'une seconde à répondre, la suivante part tout de suite après)
  function suite() { if (CAM.ouvert) CAM.minuterie = setTimeout(imageCamera, Math.max(150, 1000 - (Date.now() - depart))); }
  function recu(d) {
    if (fini) return; fini = true;
    var info = document.getElementById("camInfo"), img = document.getElementById("camImg");
    var age = d && d.ms ? (Date.now() - d.ms) / 1000 : 1e9;
    if (d && d.image && age < 90) {
      img.src = "data:image/jpeg;base64," + d.image; img.style.display = "";
      document.getElementById("camAttente").style.display = "none";
      info.textContent = "Image de " + hm(d.ms) + ":" + ("0" + new Date(d.ms).getSeconds()).slice(-2) + " · une nouvelle chaque seconde environ";
    } else if (d && d.image && img.style.display === "none") {
      // en attendant le direct : la dernière image connue, tout de suite
      img.src = "data:image/jpeg;base64," + d.image; img.style.display = "";
      document.getElementById("camAttente").style.display = "none";
      info.textContent = "Dernière image (" + hm(d.ms) + ") · le direct arrive dans quelques secondes…";
    } else if (Date.now() - CAM.debut > 40000) {
      info.textContent = "Pas d'image : le PC est peut-être éteint, le Carnet fermé, ou l'imprimante éteinte.";
      if (d && d.image) { img.src = "data:image/jpeg;base64," + d.image; img.style.display = ""; document.getElementById("camAttente").style.display = "none"; }
    }
    suite();
  }
  function ko() { if (fini) return; fini = true; document.getElementById("camInfo").textContent = "Impossible de joindre Google (réseau ?)."; suite(); }
  function jsonp() {
    var nom = "mkc" + Date.now(), s = document.createElement("script");
    window[nom] = function (d) { delete window[nom]; s.remove(); recu(d); };
    s.onerror = function () { s.remove(); ko(); };
    s.src = adresse("&action=camera_voir&callback=" + nom);
    document.head.appendChild(s);
    setTimeout(ko, 15000);
  }
  try {
    fetch(adresse("&action=camera_voir"), {credentials: "omit", cache: "no-store", redirect: "follow"})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(recu).catch(jsonp);
  } catch (e) { jsonp(); }
}

function actualiser() {
  var b = document.getElementById("bouton");
  b.disabled = true; b.textContent = "Actualisation…";
  charger(function () { b.disabled = false; b.textContent = "Actualisé ✓"; setTimeout(function () { b.textContent = "Actualiser"; }, 2500); },
          function () { b.disabled = false; b.textContent = "Actualiser"; });
}

charger();
setInterval(dessiner, 30000);
